services:
  spark-master:
    build: dockerfiles/spark
    networks:
      - scylla
    command: master
    environment:
      SPARK_PUBLIC_DNS: localhost
    ports:
      - 4040:4040
      - 8080:8080
    volumes:
      - ./data/spark-master:/tmp/data
      - ./migrator/target/scala-2.13:/jars
      - ./parquet-data:/parquet-data
      - ./:/app

  spark-worker:
    build: dockerfiles/spark
    networks:
      - scylla
    command: worker
    environment:
      SPARK_WORKER_CORES: 2
      SPARK_WORKER_MEMORY: 4G
      SPARK_WORKER_WEBUI_PORT: 8081
      SPARK_PUBLIC_DNS: localhost
    ports:
      - 8081:8081
    volumes:
      - ./data/spark-worker:/tmp/data
      - ./parquet-data:/parquet-data
    depends_on:
      - spark-master

  scylladb-node1:
    image: scylladb/scylla:latest
    networks:
      - scylla
    volumes:
      - ./data/node1:/var/lib/scylla
    command: "--seeds scylladb-node1,scylladb-node2,scylladb-node3 --smp 1 --memory 256M"
  scylladb-node2:
    image: scylladb/scylla:latest
    networks:
      - scylla
    volumes:
      - ./data/node2:/var/lib/scylla
    command: "--seeds scylladb-node1,scylladb-node2,scylladb-node3 --smp 1 --memory 256M"
  scylladb-node3:
    image: scylladb/scylla:latest
    networks:
      - scylla
    volumes:
      - ./data/node3:/var/lib/scylla
    command: "--seeds scylladb-node1,scylladb-node2,scylladb-node3 --smp 1 --memory 256M"

networks:
  scylla:
